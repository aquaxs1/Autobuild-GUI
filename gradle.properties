org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA ist noch nicht voll kompatibel mit dem Configuration Cache,
# siehe https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric-Versionen - verifiziert gegen FabricMC/fabric-example-mod (HEAD)
# und sakura-ryoko/litematica@26.2. Siehe docs/RESEARCH.md.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.156.0+26.2

# Litematica/malilib: veröffentlichte Versionen von masa.dy.fi (nicht der
# unveröffentlichte Dev-Stand 0.28.5-sakura.11 aus dem Quell-Branch).
# litematica-fabric-26.2:0.28.4 deklariert malilib-fabric-26.2:0.29.2 selbst
# als Dependency - beide Koordinaten gegen die echte POM/Metadata geprüft.
litematica_version=0.28.4
malilib_version=0.29.2

# Mod-Eigenschaften
mod_version=0.1.0
maven_group=dev.aquaxs.autobuildgui
archives_base_name=autobuild-gui
