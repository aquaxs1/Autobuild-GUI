org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache,
# see https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric versions - verified against FabricMC/fabric-example-mod (HEAD)
# and sakura-ryoko/litematica@26.2. See docs/RESEARCH.md.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.156.0+26.2

# Litematica/malilib: the published versions from masa.dy.fi (not the unpublished
# dev state 0.28.5-sakura.11 from the source branch).
# litematica-fabric-26.2:0.28.4 declares malilib-fabric-26.2:0.29.2 as a dependency
# itself - both coordinates checked against the real POM/metadata.
litematica_version=0.28.4
malilib_version=0.29.2

# Mod properties
mod_version=0.1.0
maven_group=dev.aquaxs.autobuildgui
archives_base_name=autobuild-gui
