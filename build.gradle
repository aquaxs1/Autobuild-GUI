plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft/Fabric repositories itself.
	// Baritone has no published Maven artefact for 26.2, hence libs/.
	maven {
		name = 'masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko'
		content { includeGroupAndSubgroups('fi.dy.masa') }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Litematica and malilib are soft dependencies: on the classpath at compile time
	// only (for type-safe adapter code); at runtime FabricLoader.isModLoaded(...)
	// checks before any of their classes are touched.
	// conditional-mixin-fabric is excluded: it only lives on maven.fallenbreath.me
	// (not on the allow list) and our adapter code does not need it - Litematica
	// itself brings it along at runtime.
	compileOnly("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") {
		exclude group: 'me.fallenbreath', module: 'conditional-mixin-fabric'
	}
	compileOnly("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") {
		exclude group: 'me.fallenbreath', module: 'conditional-mixin-fabric'
	}

	// Baritone is a soft dependency: on the classpath at compile time only; at runtime
	// the separately installed Baritone mod provides the classes.
	// The JAR is NOT checked in (LGPL-3.0 - link against it, do not vendor it).
	compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

// MC 26.2 laeuft auf Java 25.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
